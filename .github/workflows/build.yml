name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install

      - name: Add Android
        run: npx cap add android

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: App icon
        run: |
          IM=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            mkdir -p $RES/mipmap-$1
            $IM icon.png -resize "${2}x${2}!" $RES/mipmap-$1/ic_launcher.png
            cp $RES/mipmap-$1/ic_launcher.png $RES/mipmap-$1/ic_launcher_round.png
            cp $RES/mipmap-$1/ic_launcher.png $RES/mipmap-$1/ic_launcher_foreground.png
          done
          ls -l $RES/mipmap-xxxhdpi

      - name: Set version
        run: |
          sed -i 's/versionCode 1/versionCode 302/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "3.0.2"/' android/app/build.gradle

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
